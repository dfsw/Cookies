<!DOCTYPE html>
<html>
<head>
    <title>Cookie Clicker Mod Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Cookie Clicker Mod Test</h1>
    
    <div class="test-section">
        <h2>Seasonal Reindeer Achievements Test</h2>
        <p>This test verifies that the seasonal reindeer achievements work correctly.</p>
        
        <div id="season-info">
            <p><strong>Current Season:</strong> <span id="current-season">Loading...</span></p>
            <p><strong>Reindeer Clicked:</strong> <span id="reindeer-count">0</span></p>
        </div>
        
        <div id="achievement-status">
            <h3>Achievement Status:</h3>
            <ul id="achievement-list">
                <li>Loading achievements...</li>
            </ul>
        </div>
        
        <div id="test-controls">
            <h3>Test Controls:</h3>
            <button onclick="simulateReindeerPop()">Simulate Reindeer Pop</button>
            <button onclick="checkAchievements()">Check Achievements</button>
            <button onclick="resetTest()">Reset Test</button>
        </div>
    </div>
    
    <script>
        // Test functions
        function simulateReindeerPop() {
            if (Game && Game.reindeerClicked !== undefined) {
                Game.reindeerClicked++;
                updateDisplay();
                console.log('Simulated reindeer pop. Total:', Game.reindeerClicked);
            } else {
                console.error('Game not loaded or reindeerClicked not available');
            }
        }
        
        function checkAchievements() {
            if (Game && Game.Achievements) {
                console.log('Checking achievements...');
                // Trigger achievement checking
                if (Game.registerHook) {
                    // Manually trigger a logic hook to check achievements
                    Game.registerHook('logic', function() {
                        // This will trigger achievement checking
                    });
                }
            }
        }
        
        function resetTest() {
            if (Game) {
                Game.reindeerClicked = 0;
                Game.lastReindeerClicked = 0;
                updateDisplay();
                console.log('Test reset');
            }
        }
        
        function updateDisplay() {
            if (Game) {
                // Update season display
                var seasonSpan = document.getElementById('current-season');
                if (seasonSpan) {
                    seasonSpan.textContent = Game.baseSeason || 'None';
                }
                
                // Update reindeer count
                var countSpan = document.getElementById('reindeer-count');
                if (countSpan) {
                    countSpan.textContent = Game.reindeerClicked || 0;
                }
                
                // Update achievement list
                var list = document.getElementById('achievement-list');
                if (list && Game.Achievements) {
                    list.innerHTML = '';
                    var seasonalAchievements = [
                        "Valentine's Reindeer",
                        "April Fool's Reindeer", 
                        "Easter Reindeer",
                        "Halloween Reindeer"
                    ];
                    
                    seasonalAchievements.forEach(function(name) {
                        var ach = Game.Achievements[name];
                        if (ach) {
                            var li = document.createElement('li');
                            li.textContent = name + ': ' + (ach.won ? 'Won' : 'Not Won');
                            li.className = ach.won ? 'success' : 'error';
                            list.appendChild(li);
                        }
                    });
                }
            }
        }
        
        // Update display every second
        setInterval(updateDisplay, 1000);
        
        // Initial update
        setTimeout(updateDisplay, 2000);
    </script>
    
    <!-- Load Cookie Clicker -->
    <script src="https://orteil.dashnet.org/cookieclicker/main.js"></script>
    
    <!-- Load our mod -->
    <script src="Cookie.js"></script>
</body>
</html>
